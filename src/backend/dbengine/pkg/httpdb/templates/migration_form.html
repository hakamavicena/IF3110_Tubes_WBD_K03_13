<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{if .Editing}}Edit{{else}}Buat{{end}} Migration - DB Platform</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body { background:#f5f7fb; min-height:100vh; } .navbar-brand { font-weight:700; } .section-title { color:#24334d; font-weight:700; }</style></head>
<body><nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm"><div class="container py-2"><a class="navbar-brand" href="/dashboard"><span class="me-2">▤</span> DB Platform</a><div class="navbar-nav ms-auto"><a class="nav-link" href="/dashboard">Dashboard</a><a class="nav-link active" href="/databases">Database</a></div></div></nav>
<main class="container py-4 py-md-5"><div class="card border-0 rounded-4 shadow-sm"><div class="card-body p-3 p-md-4"><h1 class="h4 section-title mb-4">{{if .Editing}}Edit{{else}}Buat{{end}} Migration</h1>{{if .Error}}<div class="alert alert-danger" role="alert">{{.Error}}</div>{{end}}<form method="post" action="{{if .Editing}}/databases/{{.DBID}}/migrations/{{.Migration.ID}}{{else}}/databases/{{.DBID}}/migrations{{end}}"><input type="hidden" name="csrf_token" value="{{.CSRFToken}}"><div class="mb-3"><label class="form-label fw-semibold" for="migration-title">Judul</label><input class="form-control" id="migration-title" name="title" maxlength="200" required value="{{.Title}}"></div><div class="mb-4"><label class="form-label fw-semibold" for="migration-sql">SQL</label><textarea class="form-control font-monospace" id="migration-sql" name="sql" rows="12" required>{{.SQL}}</textarea></div><div class="d-flex gap-2"><button class="btn btn-primary" type="submit">Simpan Draft</button><a class="btn btn-outline-secondary" href="/databases/{{.DBID}}/migrations">Batal</a></div></form></div></div></main></body></html>
