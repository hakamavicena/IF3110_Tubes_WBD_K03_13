<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Database - DB Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body { background-color: #f5f7fb; min-height: 100vh; } .navbar-brand { font-weight: 700; letter-spacing: .3px; } .section-title { color: #24334d; font-weight: 700; } .database-card { border: 1px solid #e5eaf2; transition: transform .2s, box-shadow .2s; } .database-card:hover { transform: translateY(-2px); box-shadow: 0 .4rem 1rem rgba(0,0,0,.06); } .database-icon { width: 46px; height: 46px; display: flex; align-items: center; justify-content: center; background: #e8f1ff; color: #0d6efd; border-radius: 12px; font-size: 1.35rem; flex-shrink: 0; }</style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm"><div class="container py-2"><a class="navbar-brand" href="/dashboard"><span class="me-2">▤</span> DB Platform</a><div class="navbar-nav ms-auto"><a class="nav-link" href="/dashboard">Dashboard</a><a class="nav-link active" href="/databases">Database</a></div></div></nav>
<main class="container py-4 py-md-5">
    <div class="card border-0 rounded-4 shadow-sm"><div class="card-body p-3 p-md-4">
        <div class="d-flex align-items-center gap-2 mb-4"><div class="database-icon">▤</div><h1 class="h4 section-title mb-0">Database yang Dapat Diakses</h1></div>
        <div class="d-flex flex-column gap-3">
        {{range .Databases}}<div class="card database-card rounded-3"><div class="card-body p-3 p-md-4 d-flex flex-wrap align-items-center justify-content-between gap-3"><div class="d-flex align-items-center gap-3"><div class="database-icon">▤</div><div><h2 class="h6 fw-bold mb-2">{{.Name}}</h2><span class="badge rounded-pill {{if eq .Level 2}}text-bg-success{{else if eq .Level 1}}text-bg-primary{{else}}text-bg-secondary{{end}}">Akses level {{.Level}}</span></div></div><a class="btn btn-outline-primary btn-sm px-3" href="/databases/{{.DatabaseID}}">Lihat Schema &amp; Data</a></div></div>{{else}}<div class="alert alert-info border-0 rounded-3 mb-0">Tidak ada database yang dapat diakses.</div>{{end}}
        </div>
    </div></div>
</main>
</body>
</html>
