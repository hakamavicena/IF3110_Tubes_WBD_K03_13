<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tabel - DB Platform</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body { background:#f5f7fb; min-height:100vh; } .navbar-brand { font-weight:700; } .section-title { color:#24334d; font-weight:700; }</style></head>
<body><nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm"><div class="container py-2"><a class="navbar-brand" href="/dashboard"><span class="me-2">▤</span> DB Platform</a><div class="navbar-nav ms-auto"><a class="nav-link" href="/dashboard">Dashboard</a><a class="nav-link active" href="/databases">Database</a></div></div></nav>
<main class="container py-4 py-md-5"><div class="card border-0 rounded-4 shadow-sm"><div class="card-body p-3 p-md-4"><h1 class="h4 section-title mb-4">Tabel pada <code>{{.Schema}}</code></h1><div class="row g-3">{{range .Tables}}<div class="col-12 col-md-6 col-lg-4"><a class="card h-100 text-decoration-none border database-card" href="/databases/{{$.DBID}}/schemas/{{path .Schema}}/tables/{{path .Name}}"><div class="card-body"><h2 class="h6 fw-bold text-dark">{{.Name}}</h2><span class="badge text-bg-light border">{{.Type}}</span></div></a></div>{{else}}<div class="col-12"><div class="alert alert-info border-0 mb-0">Tidak ada tabel.</div></div>{{end}}</div></div></div></main></body></html>
