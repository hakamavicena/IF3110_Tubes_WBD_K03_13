<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Migration - DB Platform</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body { background:#f5f7fb; min-height:100vh; } .navbar-brand { font-weight:700; } .section-title { color:#24334d; font-weight:700; }</style></head>
<body><nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm"><div class="container py-2"><a class="navbar-brand" href="/dashboard"><span class="me-2">▤</span> DB Platform</a><div class="navbar-nav ms-auto"><a class="nav-link" href="/dashboard">Dashboard</a><a class="nav-link active" href="/databases">Database</a></div></div></nav>
<main class="container py-4 py-md-5"><div class="card border-0 rounded-4 shadow-sm"><div class="card-body p-3 p-md-4"><div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4"><h1 class="h4 section-title mb-0">Riwayat Migration</h1>{{if .CanEdit}}<a class="btn btn-primary btn-sm" href="/databases/{{.DBID}}/migrations/new">Buat Migration</a>{{end}}</div><div class="table-responsive"><table class="table table-hover align-middle"><thead class="table-primary"><tr><th>Versi</th><th>Judul</th><th>Status</th><th>Dibuat</th></tr></thead><tbody>{{range .Migrations}}<tr><td>{{.Version}}</td><td><a href="/databases/{{$.DBID}}/migrations/{{.ID}}" class="fw-semibold text-decoration-none">{{.Title}}</a></td><td><span class="badge {{if eq .Status "success"}}text-bg-success{{else if eq .Status "failed"}}text-bg-danger{{else if eq .Status "running"}}text-bg-warning{{else}}text-bg-secondary{{end}}">{{.Status}}</span></td><td>{{.CreatedAt}}</td></tr>{{else}}<tr><td colspan="4" class="text-secondary">Belum ada migration.</td></tr>{{end}}</tbody></table></div></div></div></main></body></html>
