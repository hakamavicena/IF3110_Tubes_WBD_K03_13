services:
  pg:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: platform
    ports:
      - "5433:5432"
    volumes:
      - pg_platform_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d platform"]
      interval: 5s
      timeout: 3s
      retries: 10

  pg_target2:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: targetpass
      POSTGRES_DB: target2_db
    ports:
      - "5434:5432"
    volumes:
      - pg_target2_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d target2_db"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pg_platform_data:
  pg_target2_data: